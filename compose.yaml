
services:
  db:
    image: postgres:17
    container_name: corppilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: corppilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: corppilot_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corppilot -d corppilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
